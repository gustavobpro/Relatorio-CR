name: Atualizar Relatório CR

on:
  schedule:
    - cron: '*/20 * * * *'   # roda sozinho a cada 20 minutos
  workflow_dispatch: {}       # permite rodar manualmente

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: Baixar planilha CR do Google Drive
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/18zt4eKFNTTTG962TsFFH2q_8tuTfeiu7IQcP7sF6vs4/export?format=xlsx" -o planilha.xlsx
      - name: Gerar relatório
        run: python gerar_relatorio.py planilha.xlsx CR index.html
      - name: Publicar (só se algo mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Atualização automática CR"
          git push
